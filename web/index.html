<div class="app">

    <section class="view" id="view-now"></section>
    <section class="view" id="view-map">
<div class="lbm" id="lbmap">

  <div class="lbm-search lbm-glass">
    <label>

      <kbd>/</kbd>
    </label>
    <ul class="lbm-results" hidden></ul>
  </div>
  <div class="lbm-tools">
    <button class="lbm-glass lbm-tool-help" title="Nearest A&amp;E, AED, pharmacy, Garda…"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Nearest help</span></button>

  <div class="lbm-measure lbm-glass" hidden></div>
  <div class="lbm-coords lbm-glass"></div>
</div>
    </section>
    <section class="view" id="view-guides"></section>
    <section class="view" id="view-library"></section>
    <section class="view" id="view-tools"></section>
    <section class="view" id="view-read">

        <button class="iconbtn" id="rdClose" title="Close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <iframe id="reader" title="Reader"></iframe>
    </section>
  </main>
</div>

<script>
(() => { const send = m => { try { navigator.sendBeacon ? navigator.sendBeacon("api/log", String(m).slice(0, 3000)) : fetch("api/log", { method: "POST", body: String(m) }); } catch {} };
  window.LBLOG = send;
  addEventListener("error", e => send("error: " + e.message + " @ " + (e.filename || "") + ":" + (e.lineno || "") + (e.error && e.error.stack ? " | " + e.error.stack : "")));
  addEventListener("unhandledrejection", e => send("rejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason))); })();
</script>
